<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SmartBox TSD</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f9; padding: 10px; color: #333; }
    .card { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 480px; margin: 0 auto 15px auto; }
    h2 { font-size: 20px; margin-bottom: 15px; text-align: center; color: #1a73e8; }
    label { font-size: 13px; font-weight: bold; color: #555; display: block; margin-bottom: 4px; }
    input, select { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 12px; outline: none; }
    input:focus { border-color: #1a73e8; background-color: #e8f0fe; }
    
    .input-group { position: relative; }
    .clear-btn {
      position: absolute; right: 12px; top: 38%; transform: translateY(-50%);
      background: #e0e0e0; border: none; border-radius: 50%; width: 26px; height: 26px;
      font-size: 14px; font-weight: bold; color: #555; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .clear-btn:active { background: #ccc; }

    .btn { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; color: white; background-color: #28a745; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 8px; }
    .btn:active { background-color: #218838; }
    
    .menu-buttons { display: flex; gap: 8px; }
    .btn-secondary { flex: 1; padding: 12px; font-size: 14px; font-weight: bold; color: #1a73e8; background-color: #e8f0fe; border: 1px solid #baddff; border-radius: 8px; cursor: pointer; }
    .btn-secondary:active { background-color: #d2e3fc; }

    .status { margin-top: 12px; padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; display: none; }
    .status.success { background-color: #d4edda; color: #155724; display: block; }
    .status.error { background-color: #f8d7da; color: #721c24; display: block; }

    .history-card { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 480px; margin: 0 auto; }
    .history-card h3 { font-size: 16px; margin-bottom: 10px; color: #333; border-bottom: 2px solid #eee; padding-bottom: 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #eee; }
    th { background-color: #f8f9fa; color: #555; font-weight: bold; }
    .total-badge { background: #e8f0fe; color: #1a73e8; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .global-badge { background: #e2fcd6; color: #28a745; padding: 2px 6px; border-radius: 4px; font-weight: bold; }

    /* Модальные окна */
    .modal {
      display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.5); padding: 10px;
    }
    .modal-content {
      background-color: #fff; margin: 20px auto; padding: 15px; border-radius: 12px;
      max-width: 500px; max-height: 85vh; display: flex; flex-direction: column;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 2px solid #eee; padding-bottom: 8px; margin-bottom: 10px;
    }
    .modal-header h3 { font-size: 18px; color: #1a73e8; }
    .close-btn { background: none; border: none; font-size: 22px; font-weight: bold; color: #777; cursor: pointer; }
    .modal-body { overflow-y: auto; flex-grow: 1; }
  </style>
</head>
<body>

  <div class="card">
    <h2>SmartBox Термінал</h2>
    
    <label for="worker">Працівник:</label>
    <select id="worker">
      <option value="Саня Павликов">Саня Павликов</option>
      <option value="Оператор 1">Оператор 1</option>
      <option value="Оператор 2">Оператор 2</option>
    </select>

    <label for="box">Ящик (Скануйте):</label>
    <div class="input-group">
      <input type="text" id="box" placeholder="Наприклад: Box-1" autocomplete="off" autofocus onclick="this.value=''">
      <button type="button" class="clear-btn" onclick="document.getElementById('box').value=''; document.getElementById('box').focus();" title="Очистити">✕</button>
    </div>

    <label for="barcode">Скан-код товара (Скануйте):</label>
    <input type="text" id="barcode" placeholder="Штрихкод" autocomplete="off">

    <label for="qty">Кількість (шт):</label>
    <input type="number" id="qty" value="1" min="1">

    <button class="btn" onclick="sendScan()">Зберегти запис</button>
    
    <div class="menu-buttons">
      <button class="btn-secondary" onclick="openHistoryModal()">📜 Історія</button>
      <button class="btn-secondary" onclick="openStockModal()">📦 Склад</button>
    </div>

    <div id="status" class="status"></div>
  </div>

  <!-- Главный экран: Сводная таблица -->
  <div class="history-card">
    <h3>📊 Зведена кількість по товарах</h3>
    <table id="summaryTable">
      <thead>
        <tr>
          <th>Штрихкод</th>
          <th>Ящик</th>
          <th>Всього шт.</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="3" style="text-align: center; color: #777;">Завантаження даних...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Модальное окно: Повна історія -->
  <div id="historyModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📜 Повна історія сканувань</h3>
        <button class="close-btn" onclick="closeModal('historyModal')">&times;</button>
      </div>
      <div class="modal-body">
        <table id="fullHistoryTable">
          <thead>
            <tr>
              <th>Дата і Час</th>
              <th>Ящик</th>
              <th>Штрихкод</th>
              <th>Кільк.</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="4" style="text-align: center; color: #777;">Завантаження...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Модальное окно: Склад (с колонками Ящ. шт. и Всього шт.) -->
  <div id="stockModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📦 Загальний склад</h3>
        <button class="close-btn" onclick="closeModal('stockModal')">&times;</button>
      </div>
      <div class="modal-body">
        <input type="text" id="stockSearch" placeholder="🔍 Пошук по штрихкоду або ящику..." oninput="filterStock()" autocomplete="off" style="margin-bottom: 10px;">
        <table id="stockTable">
          <thead>
            <tr>
              <th>Штрихкод</th>
              <th>Ящик</th>
              <th>Ящ. шт.</th>
              <th>Всього шт.</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="4" style="text-align: center; color: #777;">Завантаження...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://hjsdayynmmzajerjgqrb.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhqc2RheXlubW16YWplcmpncXJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNTY4MTEsImV4cCI6MjEwMTkzMjgxMX0.4lMQf7lpymLCEAA4OJCUwGUda1nKfoxduADDbaWGo0w";

    let globalData = [];

    window.onload = function() {
      fetchScansData();
    };

    document.getElementById('box').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('barcode').focus(); }
    });

    document.getElementById('barcode').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); sendScan(); }
    });

    async function sendScan() {
      const box = document.getElementById('box').value.trim();
      const barcode = document.getElementById('barcode').value.trim();
      const qty = parseInt(document.getElementById('qty').value) || 1;
      const worker = document.getElementById('worker').value;

      if (!box || !barcode) {
        showStatus("Заповніть Ящик та Скан-код!", "error");
        return;
      }

      const payload = { box_name: box, barcode: barcode, qty: qty, created_by: worker };

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/inventory_scans`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          showStatus(`Збережено! ${box} -> ${barcode} (${qty} шт)`, "success");
          document.getElementById('barcode').value = '';
          document.getElementById('qty').value = '1';
          document.getElementById('barcode').focus();
          fetchScansData();
        } else {
          const err = await response.text();
          showStatus("Помилка Supabase: " + err, "error");
        }
      } catch (e) {
        showStatus("Помилка мережі: " + e.message, "error");
      }
    }

    async function fetchScansData() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/inventory_scans?select=*&order=created_at.desc&limit=200`, {
          method: 'get',
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' }
        });

        if (!response.ok) return;
        globalData = await response.json();
        updateUI();
      } catch (e) {
        console.error("Помилка завантаження даних:", e);
      }
    }

    function updateUI() {
      // 1. Модалка истории
      const fullHistoryTbody = document.querySelector('#fullHistoryTable tbody');
      fullHistoryTbody.innerHTML = '';
      if (globalData.length === 0) {
        fullHistoryTbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #777;">Поки немає записів</td></tr>';
      } else {
        globalData.forEach(item => {
          let formattedDate = '';
          if (item.created_at) {
            const dt = new Date(item.created_at);
            const day = String(dt.getDate()).padStart(2, '0');
            const month = String(dt.getMonth() + 1).padStart(2, '0');
            const time = dt.toTimeString().substring(0, 5);
            formattedDate = `${day}.${month} ${time}`;
          }
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${formattedDate}</td><td><b>${item.box_name || ''}</b></td><td>${item.barcode || ''}</td><td><span class="total-badge">+${item.qty}</span></td>`;
          fullHistoryTbody.appendChild(tr);
        });
      }

      // 2. Сводка и Склад
      renderSummaryAndStock(globalData);
    }

    function renderSummaryAndStock(dataToRender) {
      // Шаг А: Считаем сумму по каждому конкретному ящику и штрихкоду
      const boxItemMap = {};
      // Шаг Б: Считаем общую сумму конкретного штрихкода по ВСЕМУ складу
      const globalBarcodeTotals = {};

      dataToRender.forEach(item => {
        const box = item.box_name || 'Без ящика';
        const barcode = item.barcode || 'Немає штрихкоду';
        const q = parseInt(item.qty) || 1;

        // Суммируем в ящике
        const boxKey = `${box}___${barcode}`;
        if (!boxItemMap[boxKey]) {
          boxItemMap[boxKey] = { box: box, barcode: barcode, boxQty: 0 };
        }
        boxItemMap[boxKey].boxQty += q;

        // Суммируем по всему складу для этого штрихкода
        if (!globalBarcodeTotals[barcode]) {
          globalBarcodeTotals[barcode] = 0;
        }
        globalBarcodeTotals[barcode] += q;
      });

      let list = Object.values(boxItemMap);
      // Сортировка по штрихкоду, а потом по ящику
      list.sort((a, b) => a.barcode.localeCompare(b.barcode) || a.box.localeCompare(b.box, undefined, { numeric: true }));

      // Главный экран (оставляем привычную сводку)
      const summaryTbody = document.querySelector('#summaryTable tbody');
      summaryTbody.innerHTML = '';
      if (list.length === 0) {
        summaryTbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #777;">Немає даних</td></tr>';
      } else {
        list.forEach(rowData => {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${rowData.barcode}</td><td><b>${rowData.box}</b></td><td><span class="total-badge">${rowData.boxQty} шт.</span></td>`;
          summaryTbody.appendChild(tr);
        });
      }

      // Окно «Склад» с новыми колонками «Ящ. шт.» и «Всього шт.»
      renderStockTable(list, globalBarcodeTotals);
    }

    function renderStockTable(list, globalTotals) {
      const stockTbody = document.querySelector('#stockTable tbody');
      stockTbody.innerHTML = '';
      if (list.length === 0) {
        stockTbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #777;">Нічого не знайдено</td></tr>';
        return;
      }

      list.forEach(rowData => {
        const totalStockQty = globalTotals[rowData.barcode] || rowData.boxQty;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${rowData.barcode}</td>
          <td><b>${rowData.box}</b></td>
          <td><span class="total-badge">${rowData.boxQty} шт.</span></td>
          <td><span class="global-badge">${totalStockQty} шт.</span></td>
        `;
        stockTbody.appendChild(tr);
      });
    }

    function filterStock() {
      const query = document.getElementById('stockSearch').value.toLowerCase().trim();
      
      const boxItemMap = {};
      const globalBarcodeTotals = {};

      globalData.forEach(item => {
        const box = item.box_name || 'Без ящика';
        const barcode = item.barcode || 'Немає штрихкоду';
        const q = parseInt(item.qty) || 1;

        const boxKey = `${box}___${barcode}`;
        if (!boxItemMap[boxKey]) {
          boxItemMap[boxKey] = { box: box, barcode: barcode, boxQty: 0 };
        }
        boxItemMap[boxKey].boxQty += q;

        if (!globalBarcodeTotals[barcode]) globalBarcodeTotals[barcode] = 0;
        globalBarcodeTotals[barcode] += q;
      });

      let list = Object.values(boxItemMap);

      // Фильтрация по поиску (штрихкод или ящик)
      const filtered = list.filter(item => 
        item.barcode.toLowerCase().includes(query) || item.box.toLowerCase().includes(query)
      );

      filtered.sort((a, b) => a.barcode.localeCompare(b.barcode) || a.box.localeCompare(b.box, undefined, { numeric: true }));
      renderStockTable(filtered, globalBarcodeTotals);
    }

    function openHistoryModal() {
      document.getElementById('historyModal').style.display = 'block';
      fetchScansData();
    }

    function openStockModal() {
      document.getElementById('stockModal').style.display = 'block';
      document.getElementById('stockSearch').value = '';
      fetchScansData();
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }

    window.onclick = function(event) {
      if (event.target.classList.contains('modal')) {
        event.target.style.display = 'none';
      }
    }

    function showStatus(text, type) {
      const statusDiv = document.getElementById('status');
      statusDiv.innerText = text;
      statusDiv.className = `status ${type}`;
    }
  </script>
</body>
</html>
