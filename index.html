<script>
    const SUPABASE_URL = "https://hjsdayynmmzajerjgqrb.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhqc2RheXlubW16YWplcmpncXJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNTY4MTEsImV4cCI6MjEwMTkzMjgxMX0.4lMQf7lpymLCEAA4OJCUwGUda1nKfoxduADDbaWGo0w";

    let globalData = [];

    window.onload = function() {
      fetchScansData();
    };

    document.getElementById('box').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('barcode').focus(); }
    });

    document.getElementById('barcode').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); sendScan(); }
    });

    // Шаг 2: Отправляем чистые сырые данные (без лишних полей), склад не останавливается
    async function sendScan() {
      const box = document.getElementById('box').value.trim();
      const barcode = document.getElementById('barcode').value.trim();
      const qty = parseInt(document.getElementById('qty').value) || 1;
      const worker = document.getElementById('worker').value;

      if (!box || !barcode) {
        showStatus("Заповніть Ящик та Скан-код!", "error");
        return;
      }

      const payload = { 
        box_name: box, 
        barcode: barcode, 
        qty: qty, 
        created_by: worker
      };

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/inventory_scans`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          showStatus(`Збережено! Ящик: ${box} | Штрихкод: ${barcode}`, "success");
          document.getElementById('barcode').value = '';
          document.getElementById('qty').value = '1';
          document.getElementById('barcode').focus();
          fetchScansData();
        } else {
          const err = await response.text();
          showStatus("Помилка Supabase: " + err, "error");
        }
      } catch (e) {
        showStatus("Помилка мережі: " + e.message, "error");
      }
    }

    // Шаг 3: Загружаем данные из умного SQL-представления view_dashboard_stock
    async function fetchScansData() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/view_dashboard_stock?select=*&order=created_at.desc&limit=200`, {
          method: 'get',
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' }
        });

        if (!response.ok) return;
        globalData = await response.json();
        updateUI();
      } catch (e) {
        console.error("Помилка завантаження даних:", e);
      }
    }

    function updateUI() {
      const fullHistoryTbody = document.querySelector('#fullHistoryTable tbody');
      fullHistoryTbody.innerHTML = '';
      if (globalData.length === 0) {
        fullHistoryTbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #777;">Поки немає записів</td></tr>';
      } else {
        globalData.forEach(item => {
          let formattedDate = '';
          if (item.created_at) {
            const dt = new Date(item.created_at);
            const day = String(dt.getDate()).padStart(2, '0');
            const month = String(dt.getMonth() + 1).padStart(2, '0');
            const time = dt.toTimeString().substring(0, 5);
            formattedDate = `${day}.${month} ${time}`;
          }
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${formattedDate}</td><td><b>${item.box_name || ''}</b></td><td>${item.barcode || ''}</td><td><span class="total-badge">+${item.qty}</span></td>`;
          fullHistoryTbody.appendChild(tr);
        });
      }

      renderSummaryAndStock(globalData);
    }

    function renderSummaryAndStock(dataToRender) {
      const boxItemMap = {};
      const globalBarcodeTotals = {};

      dataToRender.forEach(item => {
        const box = item.box_name || 'Без ящика';
        const barcode = item.barcode || 'Немає штрихкоду';
        const q = parseInt(item.qty) || 1;

        const boxKey = `${box}___${barcode}`;
        if (!boxItemMap[boxKey]) {
          boxItemMap[boxKey] = { 
            box: box, 
            barcode: barcode, 
            boxQty: 0, 
            name: item.product_name, 
            product_code: item.product_code 
          };
        }
        boxItemMap[boxKey].boxQty += q;

        if (!globalBarcodeTotals[barcode]) {
          globalBarcodeTotals[barcode] = 0;
        }
        globalBarcodeTotals[barcode] += q;
      });

      const listSummary = [];
      const seenSummary = new Set();
      dataToRender.forEach(item => {
        const box = item.box_name || 'Без ящика';
        const barcode = item.barcode || 'Немає штрихкоду';
        const boxKey = `${box}___${barcode}`;
        if (!seenSummary.has(boxKey)) {
          seenSummary.add(boxKey);
          listSummary.push(boxItemMap[boxKey]);
        }
      });

      const summaryTbody = document.querySelector('#summaryTable tbody');
      summaryTbody.innerHTML = '';
      if (listSummary.length === 0) {
        summaryTbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #777;">Немає даних</td></tr>';
      } else {
        listSummary.forEach(rowData => {
          const tr = document.createElement('tr');
          
          // Если товар не найден в базе, подсветим строку или код желтоватым оттенком для контроля
          const isUnknown = rowData.product_code === 'БД_?';
          if (isUnknown) {
            tr.style.backgroundColor = '#fffdf0';
          }

          tr.innerHTML = `
            <td>
              ${rowData.barcode} 
              <span class="total-badge" style="background: ${isUnknown ? '#f8d7da' : '#e8f0fe'}; color: ${isUnknown ? '#721c24' : '#1a73e8'}; font-size:11px; margin-left:4px;">${rowData.product_code}</span>
              <br><small style="color:${isUnknown ? '#c5221f' : '#666'}; font-weight:${isUnknown ? 'bold' : 'normal'};">${rowData.name || ''}</small>
            </td>
            <td><b>${rowData.box}</b></td>
            <td><span class="total-badge">${rowData.boxQty} шт.</span></td>
          `;
          summaryTbody.appendChild(tr);
        });
      }

      const listStock = Object.values(boxItemMap);
      listStock.sort((a, b) => a.box.localeCompare(b.box, undefined, { numeric: true }) || a.barcode.localeCompare(b.barcode));

      renderStockTable(listStock, globalBarcodeTotals);
    }

    function renderStockTable(list, globalTotals) {
      const stockTbody = document.querySelector('#stockTable tbody');
      stockTbody.innerHTML = '';
      if (list.length === 0) {
        stockTbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #777;">Нічого не знайдено</td></tr>';
        return;
      }

      list.forEach(rowData => {
        const totalStockQty = globalTotals[rowData.barcode] || rowData.boxQty;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><b>${rowData.box}</b></td>
          <td>${rowData.barcode}</td>
          <td><span class="total-badge">${rowData.boxQty} шт.</span></td>
          <td><span class="global-badge">${totalStockQty} шт.</span></td>
        `;
        stockTbody.appendChild(tr);
      });
    }

    function filterStock() {
      const query = document.getElementById('stockSearch').value.toLowerCase().trim();
      
      const boxItemMap = {};
      const globalBarcodeTotals = {};

      globalData.forEach(item => {
        const box = item.box_name || 'Без ящика';
        const barcode = item.barcode || 'Немає штрихкоду';
        const q = parseInt(item.qty) || 1;

        const boxKey = `${box}___${barcode}`;
        if (!boxItemMap[boxKey]) {
          boxItemMap[boxKey] = { box: box, barcode: barcode, boxQty: 0 };
        }
        boxItemMap[boxKey].boxQty += q;

        if (!globalBarcodeTotals[barcode]) globalBarcodeTotals[barcode] = 0;
        globalBarcodeTotals[barcode] += q;
      });

      let listStock = Object.values(boxItemMap);

      const filtered = listStock.filter(item => 
        item.barcode.toLowerCase().includes(query) || item.box.toLowerCase().includes(query)
      );

      filtered.sort((a, b) => a.box.localeCompare(b.box, undefined, { numeric: true }) || a.barcode.localeCompare(b.barcode));
      renderStockTable(filtered, globalBarcodeTotals);
    }

    function openHistoryModal() {
      document.getElementById('historyModal').style.display = 'block';
      fetchScansData();
    }

    function openStockModal() {
      document.getElementById('stockModal').style.display = 'block';
      document.getElementById('stockSearch').value = '';
      fetchScansData();
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }

    window.onclick = function(event) {
      if (event.target.classList.contains('modal')) {
        event.target.style.display = 'none';
      }
    }

    function showStatus(text, type) {
      const statusDiv = document.getElementById('status');
      statusDiv.innerText = text;
      statusDiv.className = `status ${type}`;
    }
  </script>
